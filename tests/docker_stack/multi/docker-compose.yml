name: stackrun-test-multi

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 15
      start_period: 1s
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18081:80"
