tunnel: false
process:
  killOthers: failure
  handleInput: false
before:
  - docker compose -f docker-compose.yml up -d --wait
after:
  - docker compose -f docker-compose.yml down -v
commands:
  - name: web
    color: cyan
    # Dummy: hit the mapped host port (nginx:alpine has no curl). Exit 0 so down runs.
    run: >-
      sh -c 'url=http://127.0.0.1:18080/; i=0; fetch() { wget -qO- "$url" 2>/dev/null || curl -fsS "$url"; };
      until fetch >/dev/null; do i=$((i+1)); if [ "$i" -ge 20 ]; then exit 1; fi; sleep 0.25; done;
      fetch'
