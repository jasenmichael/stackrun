[package]
name = "stackrun"
version = "1.0.1"
edition = "2021"
rust-version = "1.74"
license = "MIT"
authors = ["Jasen Michael"]
repository = "https://github.com/jasenmichael/stackrun"
homepage = "https://jasenmichael.github.io/stackrun/"
documentation = "https://jasenmichael.github.io/stackrun/"
description = "Run multiple local services with optional Cloudflare tunnels, including stable HTTPS hosts for OAuth callback URLs"
readme = "README.md"
keywords = ["cli", "process", "concurrent", "cloudflare", "tunnel"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["graphify-out/", "site/", "website/", "dist/", "SHA256SUMS"]

[[bin]]
name = "stackrun"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ctrlc = { version = "3", features = ["termination"] }
json5 = "0.4"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
