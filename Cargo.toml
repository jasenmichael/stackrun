[package]
name = "stackrun"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jasenmichael/stackrun"
description = "Run multiple services with optional Cloudflare tunneling"
readme = "README.md"

[[bin]]
name = "stackrun"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = { version = "3", features = ["termination"] }
json5 = "0.4"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
